name: glance
options:
  bundleIdPrefix: com.glance
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  glance:
    type: application
    platform: macOS
    sources:
      - glance
    settings:
      base:
        INFOPLIST_FILE: glance/Info.plist
        CODE_SIGN_ENTITLEMENTS: glance/glance.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.glance.app
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES

  glanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - glanceTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.glance.glanceTests
        # xcodegen does not infer these for app-hosted unit tests — point the
        # test bundle at the glance.app binary built alongside it so it can
        # run in-process (@testable import glance, shared UserDefaults, etc.)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/glance.app/Contents/MacOS/glance"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
    dependencies:
      - target: glance

schemes:
  glance:
    build:
      targets:
        glance: [run, test, profile, analyze, archive]
        glanceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - glanceTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
